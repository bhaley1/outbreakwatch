name: Global Foodborne Outbreak Monitor

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 feedparser
        
    - name: Run foodborne outbreak scraper
      run: python real_foodborne_scraper.py
      
    - name: Commit updated foodborne data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if foodborne_outbreaks.json was created/updated
        if [ -f foodborne_outbreaks.json ]; then
          git add foodborne_outbreaks.json
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update real foodborne outbreak data - $(date -u)"
            git push
          else
            echo "No changes to foodborne outbreak data"
          fi
        else
          echo "No foodborne outbreak data generated"
        fi
      
    - name: Update README with scan results
      run: |
        echo "## Last Foodborne Outbreak Scan" >> scan_results.md
        echo "**Date:** $(date -u)" >> scan_results.md
        echo "" >> scan_results.md
        
        if [ -f foodborne_outbreaks.json ]; then
          OUTBREAK_COUNT=$(python -c "import json; data=json.load(open('foodborne_outbreaks.json')); print(data['total_outbreaks'])")
          echo "**Active Outbreaks Found:** $OUTBREAK_COUNT" >> scan_results.md
          echo "" >> scan_results.md
          echo "Data sources: WHO, ECDC, Health Canada, CDC" >> scan_results.md
        else
          echo "**Status:** No outbreaks detected" >> scan_results.md
        fi
        
        # Commit scan results
        git add scan_results.md
        git commit -m "Update foodborne outbreak scan results" || echo "No changes to commit"
        git push || echo "Nothing to push"
