name: Update Outbreak Feed

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch Outbreak Data
        run: |
          python3 << 'EOF'
          import requests
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from bs4 import BeautifulSoup
          import re

          HEADERS = {'User-Agent': 'Mozilla/5.0 (compatible; OutbreakWatch/1.0)'}
          items = []
          sources_ok = []
          errors = []

          def clean(text):
              if not text: return ''
              text = re.sub(r'<[^>]+>', '', text)
              return re.sub(r'\s+', ' ', text).strip()

          def categorize(title, desc):
              c = (title + ' ' + desc).lower()
              if any(w in c for w in ['animal','livestock','cattle','poultry','swine','pig','avian','bird flu','wildlife','veterinary','equine','bovine','feline','canine','zoonot']):
                  return 'animal'
              if any(w in c for w in ['plant','crop','agriculture','wheat','rice','cassava','locust','blight']):
                  return 'plant'
              return 'human'

          # ── SOURCE 1: CDC EID RSS ─────────────────────────────────────────────
          try:
              feeds = ['https://wwwnc.cdc.gov/eid/rss/ahead-of-print', 'https://wwwnc.cdc.gov/eid/rss/table-of-contents']
              cdc_count = 0
              for feed_url in feeds:
                  try:
                      r = requests.get(feed_url, headers=HEADERS, timeout=20)
                      # Parse with lenient handling
                      content = r.content
                      try:
                          root = ET.fromstring(content)
                      except ET.ParseError:
                          # Try cleaning the XML
                          content = re.sub(rb'&(?!(amp|lt|gt|quot|apos);)', b'&amp;', content)
                          root = ET.fromstring(content)
                      for item in root.findall('.//item')[:15]:
                          title = clean(item.findtext('title',''))
                          link  = clean(item.findtext('link',''))
                          date  = clean(item.findtext('pubDate',''))
                          desc  = clean(item.findtext('description',''))[:300]
                          if title and len(title) > 10:
                              items.append({
                                  'title': title, 'link': link, 'pubDate': date,
                                  'description': desc, 'category': categorize(title, desc),
                                  'source': 'CDC EID'
                              })
                              cdc_count += 1
                  except Exception:
                      continue
              sources_ok.append(f'CDC EID: {cdc_count}')
          except Exception as e:
              errors.append(f'CDC EID: {str(e)}')

          # ── SOURCE 2: WHO DON - scrape and fetch individual pages ──────────────
          try:
              r = requests.get('https://www.who.int/emergencies/disease-outbreak-news', headers=HEADERS, timeout=25)
              soup = BeautifulSoup(r.text, 'lxml')
              
              don_links = []
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  if '/disease-outbreak-news/item/' in href:
                      if href not in don_links:
                          don_links.append(href)
              
              who_count = 0
              # Get first 10 DON items and fetch their full pages for descriptions
              for href in don_links[:10]:
                  try:
                      full_url = 'https://www.who.int' + href if href.startswith('/') else href
                      
                      # Fetch the actual report page
                      page_r = requests.get(full_url, headers=HEADERS, timeout=15)
                      page_soup = BeautifulSoup(page_r.text, 'lxml')
                      
                      # Extract title
                      title_el = page_soup.find('h1') or page_soup.find('title')
                      title = clean(title_el.get_text()) if title_el else ''
                      title = title.replace('| WHO', '').strip()
                      
                      # Extract date
                      date_el = page_soup.find('span', class_='timestamp') or page_soup.find('time')
                      date_str = clean(date_el.get_text()) if date_el else ''
                      
                      # Extract first paragraph as description
                      content_div = page_soup.find('div', class_='sf-detail-body-wrapper') or page_soup.find('article') or page_soup.find('main')
                      first_p = content_div.find('p') if content_div else None
                      desc = clean(first_p.get_text())[:400] if first_p else ''
                      
                      if title and len(title) > 5:
                          items.append({
                              'title': title, 'link': full_url, 'pubDate': date_str,
                              'description': desc, 'category': categorize(title, desc),
                              'source': 'WHO DON'
                          })
                          who_count += 1
                  except Exception:
                      continue
              
              sources_ok.append(f'WHO DON: {who_count}')
          except Exception as e:
              errors.append(f'WHO DON: {str(e)}')

          # ── SOURCE 3: ECDC CDTR with full report fetching ──────────────────────
          try:
              r = requests.get('https://www.ecdc.europa.eu/en/threats-and-outbreaks/reports-and-data/weekly-threats', headers=HEADERS, timeout=20)
              soup = BeautifulSoup(r.text, 'lxml')
              ecdc_count = 0
              seen = set()
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  title = clean(a.get_text())
                  if ('communicable-disease-threats-report' in href) and title and len(title) > 15:
                      if href not in seen:
                          seen.add(href)
                          full_url = 'https://www.ecdc.europa.eu' + href if href.startswith('/') else href
                          
                          # Try to fetch the actual CDTR for content
                          try:
                              page_r = requests.get(full_url, headers=HEADERS, timeout=15)
                              page_soup = BeautifulSoup(page_r.text, 'lxml')
                              # Get summary content
                              content = page_soup.find('div', class_='field--name-body') or page_soup.find('article')
                              desc = clean(content.get_text())[:500] if content else ''
                          except:
                              desc = ''
                          
                          items.append({
                              'title': title, 'link': full_url, 'pubDate': '',
                              'description': desc, 'category': categorize(title, desc),
                              'source': 'ECDC'
                          })
                          ecdc_count += 1
                          if ecdc_count >= 5: break  # Limit to most recent
              sources_ok.append(f'ECDC: {ecdc_count}')
          except Exception as e:
              errors.append(f'ECDC: {str(e)}')

          # ── SOURCE 4: PAHO Epidemiological Alerts with descriptions ────────────
          try:
              r = requests.get('https://www.paho.org/en/epidemiological-alerts-and-updates', headers=HEADERS, timeout=20)
              soup = BeautifulSoup(r.text, 'lxml')
              paho_count = 0
              seen = set()
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  title = clean(a.get_text())
                  if ('epidemiological-alert' in href or 'epidemiological-update' in href) and title and len(title) > 10:
                      if href not in seen:
                          seen.add(href)
                          full_url = 'https://www.paho.org' + href if href.startswith('/') else href
                          items.append({
                              'title': title, 'link': full_url, 'pubDate': '',
                              'description': '', 'category': categorize(title, ''),
                              'source': 'PAHO'
                          })
                          paho_count += 1
              sources_ok.append(f'PAHO: {paho_count}')
          except Exception as e:
              errors.append(f'PAHO: {str(e)}')

          # Deduplicate
          seen_titles = set()
          unique = []
          for item in items:
              key = item['title'].lower()[:50]
              if key not in seen_titles and len(item['title']) > 5:
                  seen_titles.add(key)
                  unique.append(item)

          output = {
              'items': unique, 'updated': datetime.utcnow().isoformat() + 'Z',
              'count': len(unique), 'sources': sources_ok, 'errors': errors
          }

          with open('feed.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"Total: {len(unique)} items | Sources: {sources_ok}")
          EOF

      - name: Run Claude AI Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, os, requests
          from datetime import datetime

          api_key = os.environ.get('ANTHROPIC_API_KEY','').strip()
          if not api_key:
              print("⚠️  No ANTHROPIC_API_KEY secret set - skipping AI analysis")
              with open('analysis.json','w') as f:
                  json.dump({'error':'API key not configured','updated':datetime.utcnow().isoformat()+'Z'}, f)
              exit(0)

          with open('feed.json') as f:
              feed = json.load(f)

          items = feed.get('items', [])
          if not items:
              with open('analysis.json','w') as f:
                  json.dump({'error':'No feed data','updated':datetime.utcnow().isoformat()+'Z'}, f)
              exit(0)

          # Build report text
          reports = []
          for i, item in enumerate(items[:30]):
              reports.append(f"[{i+1}] Source: {item.get('source','')}\nTitle: {item.get('title','')}\nDate: {item.get('pubDate','')}\nDescription: {item.get('description','')}\nCategory: {item.get('category','')}\n")

          report_text = '\n'.join(reports)

          system_prompt = """You are a senior epidemiologist and global health security analyst. Analyze surveillance reports to identify biological threats. Focus only on factual epidemiological signals. Use threat levels: Critical, Elevated, Moderate, Low."""

          user_prompt = f"""Analyze these {len(items)} disease surveillance reports and respond ONLY with a JSON object (no markdown, no preamble):

{{
  "executiveSummary": "3-4 sentence overview of current threat landscape",
  "bottomLine": "one-sentence key takeaway for decision-makers",
  "threats": [
    {{"name":"Disease name","pathogen":"Pathogen scientific name","level":"Critical|Elevated|Moderate|Low","location":"Country/Region","signals":["signal 1","signal 2","signal 3"],"confidence":85,"action":"Recommended surveillance action"}}
  ],
  "geography": [
    {{"region":"Region/Country","count":3,"diseases":["disease1","disease2"]}}
  ],
  "categories": {{
    "human": 0,
    "animal": 0,
    "plant": 0
  }},
  "amrSignals": ["AMR concern 1","AMR concern 2"],
  "emergingPatterns": ["pattern 1","pattern 2"],
  "timeline": [
    {{"date":"YYYY-MM-DD","event":"Brief description","level":"Critical|Elevated|Moderate|Low"}}
  ]
}}

Identify up to 8 threats. Include actual locations from report titles/descriptions. Count diseases by region. Categorize all reports by human/animal/plant.

REPORTS:
{report_text}"""

          try:
              r = requests.post(
                  'https://api.anthropic.com/v1/messages',
                  headers={
                      'Content-Type': 'application/json',
                      'x-api-key': api_key,
                      'anthropic-version': '2023-06-01'
                  },
                  json={
                      'model': 'claude-sonnet-4-20250514',
                      'max_tokens': 3000,
                      'system': system_prompt,
                      'messages': [{'role':'user','content':user_prompt}]
                  },
                  timeout=60
              )
              data = r.json()
              raw_text = data['content'][0]['text']
              
              # Extract JSON
              import re
              json_match = re.search(r'\{[\s\S]*\}', raw_text)
              if json_match:
                  analysis = json.loads(json_match.group(0))
                  analysis['updated'] = datetime.utcnow().isoformat() + 'Z'
                  analysis['totalReports'] = len(items)
                  
                  with open('analysis.json','w') as f:
                      json.dump(analysis, f, indent=2)
                  print(f"✅ Analysis saved - {len(analysis.get('threats',[]))} threats identified")
              else:
                  raise Exception("Could not parse JSON from response")
          except Exception as e:
              print(f"Analysis error: {e}")
              with open('analysis.json','w') as f:
                  json.dump({'error':str(e),'updated':datetime.utcnow().isoformat()+'Z'}, f)
          EOF

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json analysis.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update outbreak feed & AI analysis - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
