name: Update Outbreak Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch Outbreak Data
        run: |
          python3 << 'EOF'
          import requests
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from bs4 import BeautifulSoup
          import re

          HEADERS = {'User-Agent': 'Mozilla/5.0 (compatible; OutbreakWatch/1.0)'}
          items = []
          sources_ok = []
          errors = []

          def clean(text):
              if not text: return ''
              text = re.sub(r'<[^>]+>', '', text)
              return re.sub(r'\s+', ' ', text).strip()

          def categorize(title, desc):
              c = (title + ' ' + desc).lower()
              if any(w in c for w in ['animal','livestock','cattle','poultry','swine','pig','avian','bird flu','wildlife','veterinary','equine','bovine','feline','canine','zoonot']):
                  return 'animal'
              if any(w in c for w in ['plant','crop','agriculture','wheat','rice','cassava','locust','blight']):
                  return 'plant'
              return 'human'

          # ── SOURCE 1: CDC Emerging Infectious Diseases RSS (confirmed working) ─
          try:
              feeds = [
                  'https://wwwnc.cdc.gov/eid/rss/ahead-of-print',
                  'https://wwwnc.cdc.gov/eid/rss/table-of-contents',
              ]
              cdc_count = 0
              for feed_url in feeds:
                  r = requests.get(feed_url, headers=HEADERS, timeout=20)
                  root = ET.fromstring(r.content)
                  for item in root.findall('.//item')[:15]:
                      title = clean(item.findtext('title',''))
                      link  = clean(item.findtext('link',''))
                      date  = clean(item.findtext('pubDate',''))
                      desc  = clean(item.findtext('description',''))[:300]
                      if title and len(title) > 10:
                          items.append({
                              'title': title,
                              'link': link,
                              'pubDate': date,
                              'description': desc,
                              'category': categorize(title, desc),
                              'source': 'CDC EID'
                          })
                          cdc_count += 1
              sources_ok.append(f'CDC EID: {cdc_count} items')
          except Exception as e:
              errors.append(f'CDC EID: {str(e)}')

          # ── SOURCE 2: WHO DON - scrape the list page properly ─────────────────
          try:
              r = requests.get(
                  'https://www.who.int/emergencies/disease-outbreak-news',
                  headers=HEADERS, timeout=25
              )
              soup = BeautifulSoup(r.text, 'lxml')
              
              # WHO DON uses specific link patterns: /emergencies/disease-outbreak-news/item/
              don_links = []
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  if '/disease-outbreak-news/item/' in href or '/emergencies/disease-outbreak-news/item/' in href:
                      if href not in [x['link'] for x in don_links]:
                          don_links.append({
                              'href': href,
                              'text': clean(a.get_text())
                          })
              
              who_count = 0
              seen = set()
              for item in don_links[:20]:
                  href = item['href']
                  if href in seen: continue
                  seen.add(href)
                  
                  full_url = 'https://www.who.int' + href if href.startswith('/') else href
                  title = item['text']
                  if not title or len(title) < 5:
                      # Use URL slug as fallback title
                      title = href.split('/')[-1].replace('-', ' ').title()
                  
                  if len(title) > 5:
                      items.append({
                          'title': title,
                          'link': full_url,
                          'pubDate': '',
                          'description': '',
                          'category': categorize(title, ''),
                          'source': 'WHO DON'
                      })
                      who_count += 1
              
              sources_ok.append(f'WHO DON: {who_count} items')
          except Exception as e:
              errors.append(f'WHO DON: {str(e)}')

          # ── SOURCE 3: ECDC Weekly Threat Report - target specific content ──────
          try:
              r = requests.get(
                  'https://www.ecdc.europa.eu/en/threats-and-outbreaks/reports-and-data/weekly-threats',
                  headers=HEADERS, timeout=20
              )
              soup = BeautifulSoup(r.text, 'lxml')
              
              ecdc_count = 0
              seen = set()
              # Target only actual report links
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  title = clean(a.get_text())
                  # Only include links to actual CDTR publications
                  if ('communicable-disease-threats' in href or 
                      'cdtr' in href.lower() or
                      'weekly-threat' in href) and title and len(title) > 15:
                      if href not in seen:
                          seen.add(href)
                          full_url = 'https://www.ecdc.europa.eu' + href if href.startswith('/') else href
                          items.append({
                              'title': title,
                              'link': full_url,
                              'pubDate': '',
                              'description': '',
                              'category': categorize(title, ''),
                              'source': 'ECDC'
                          })
                          ecdc_count += 1
              sources_ok.append(f'ECDC: {ecdc_count} items')
          except Exception as e:
              errors.append(f'ECDC: {str(e)}')

          # ── SOURCE 4: PAHO Epidemiological Alerts ─────────────────────────────
          try:
              r = requests.get(
                  'https://www.paho.org/en/epidemiological-alerts-and-updates',
                  headers=HEADERS, timeout=20
              )
              soup = BeautifulSoup(r.text, 'lxml')
              
              paho_count = 0
              seen = set()
              # Target links with /en/epidemiological-alert or /en/epidemiological-update
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  title = clean(a.get_text())
                  if ('epidemiological-alert' in href or 
                      'epidemiological-update' in href) and title and len(title) > 10:
                      if href not in seen:
                          seen.add(href)
                          full_url = 'https://www.paho.org' + href if href.startswith('/') else href
                          items.append({
                              'title': title,
                              'link': full_url,
                              'pubDate': '',
                              'description': '',
                              'category': categorize(title, ''),
                              'source': 'PAHO'
                          })
                          paho_count += 1
              sources_ok.append(f'PAHO: {paho_count} items')
          except Exception as e:
              errors.append(f'PAHO: {str(e)}')

          # ── SOURCE 5: WOAH (Animal Health) ────────────────────────────────────
          try:
              r = requests.get(
                  'https://wahis.woah.org/api/v1/reports/immediate?page=0&pageSize=20',
                  headers=HEADERS, timeout=20
              )
              data = r.json()
              reports = data.get('data', data.get('results', data.get('reports', [])))
              woah_count = 0
              if isinstance(reports, list):
                  for report in reports[:15]:
                      title = report.get('disease', report.get('title', report.get('name', '')))
                      country = report.get('country', report.get('countryName', ''))
                      if title:
                          full_title = f"{title} - {country}" if country else title
                          items.append({
                              'title': full_title,
                              'link': 'https://wahis.woah.org',
                              'pubDate': report.get('reportDate', report.get('date', '')),
                              'description': report.get('summary', '')[:300],
                              'category': 'animal',
                              'source': 'WOAH'
                          })
                          woah_count += 1
              sources_ok.append(f'WOAH: {woah_count} items')
          except Exception as e:
              errors.append(f'WOAH: {str(e)}')

          # ── Deduplicate and output ─────────────────────────────────────────────
          seen_titles = set()
          unique = []
          for item in items:
              key = item['title'].lower()[:50]
              if key not in seen_titles and len(item['title']) > 5:
                  seen_titles.add(key)
                  unique.append(item)

          output = {
              'items': unique,
              'updated': datetime.utcnow().isoformat() + 'Z',
              'count': len(unique),
              'sources': sources_ok,
              'errors': errors
          }

          with open('feed.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"✅ Total: {len(unique)} items")
          print(f"Sources: {sources_ok}")
          if errors: print(f"Errors: {errors}")
          EOF

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update outbreak feed - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
